name: Managed RustDesk Windows x64

on:
  push:
    branches: [managed-windows]
  workflow_dispatch:

permissions:
  contents: read

env:
  VERSION: "1.5.3"
  FLUTTER_VERSION: "3.24.5"
  SCITER_RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate managed build configuration
        env:
          RUSTDESK_ID_SERVER: ${{ vars.RUSTDESK_ID_SERVER }}
          RUSTDESK_RELAY_SERVER: ${{ vars.RUSTDESK_RELAY_SERVER }}
          RUSTDESK_SERVER_PUBLIC_KEY: ${{ vars.RUSTDESK_SERVER_PUBLIC_KEY }}
          MANAGEMENT_API_URL: ${{ vars.MANAGEMENT_API_URL }}
          MANAGEMENT_API_ENCRYPTION_PUBLIC_KEY: ${{ vars.MANAGEMENT_API_ENCRYPTION_PUBLIC_KEY }}
          MANAGEMENT_API_ENCRYPTION_KEY_ID: ${{ vars.MANAGEMENT_API_ENCRYPTION_KEY_ID }}
        run: python res/managed/validate-build.py
  bridge:
    needs: validate
    uses: ./.github/workflows/bridge.yml
    with:
      managed-windows: true
  window-helper:
    needs: validate
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10
  exe:
    needs: [bridge, window-helper]
    runs-on: windows-2022
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        id: flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225  # v2.12.0; https://github.com/subosito/flutter-action/issues/277
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]]; then
            git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-x64-windows-static-rel-out.log" || true
        shell: bash

      - name: Build rustdesk
        env:
          RUSTDESK_MANAGED_BUILD: "1"
          RUSTDESK_ID_SERVER: ${{ vars.RUSTDESK_ID_SERVER }}
          RUSTDESK_RELAY_SERVER: ${{ vars.RUSTDESK_RELAY_SERVER }}
          RUSTDESK_SERVER_PUBLIC_KEY: ${{ vars.RUSTDESK_SERVER_PUBLIC_KEY }}
          MANAGEMENT_API_URL: ${{ vars.MANAGEMENT_API_URL }}
          MANAGEMENT_API_ENCRYPTION_PUBLIC_KEY: ${{ vars.MANAGEMENT_API_ENCRYPTION_PUBLIC_KEY }}
          MANAGEMENT_API_ENCRYPTION_KEY_ID: ${{ vars.MANAGEMENT_API_ENCRYPTION_KEY_ID }}
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          if ($LASTEXITCODE -ne 0) { throw "RustDesk build failed" }
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk

          # Download usbmmidd_v2.zip and extract it to ./rustdesk
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk

          # Download printer driver files and extract them to ./rustdesk
          try {
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip -OutFile rustdesk_printer_driver_v4-1.4.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/printer_driver_adapter.zip -OutFile printer_driver_adapter.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/sha256sums -OutFile sha256sums

            # Check and move the files
            $checksum_driver = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*rustdesk_printer_driver_v4-1.4\.zip$').Matches.Groups[1].Value
            $downloadsum_driver = Get-FileHash -Path rustdesk_printer_driver_v4-1.4.zip -Algorithm SHA256
            $checksum_adapter = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*printer_driver_adapter\.zip$').Matches.Groups[1].Value
            $downloadsum_adapter = Get-FileHash -Path printer_driver_adapter.zip -Algorithm SHA256
            if ($checksum_driver -eq $downloadsum_driver.Hash -and $checksum_adapter -eq $downloadsum_adapter.Hash) {
                Write-Output "rustdesk_printer_driver_v4-1.4, checksums match, extract the file."
                Expand-Archive rustdesk_printer_driver_v4-1.4.zip -DestinationPath .
                mkdir ./rustdesk/drivers
                mv -Force .\rustdesk_printer_driver_v4-1.4 ./rustdesk/drivers/RustDeskPrinterDriver
                Expand-Archive printer_driver_adapter.zip -DestinationPath .
                mv -Force .\printer_driver_adapter.dll ./rustdesk
            } elseif ($checksum_driver -ne $downloadsum_driver.Hash) {
                Write-Output "rustdesk_printer_driver_v4-1.4, checksums do not match, ignore the file."
            } else {
                Write-Output "printer_driver_adapter.dll, checksums do not match, ignore the file."
            }
          } catch {
              Write-Host "Ingore the printer driver error."
          }

      - name: Download RustDeskTempTopMostWindow artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: topmostwindow-artifacts-x64
          path: "./rustdesk"

      - name: Build Windows x64 EXE installer
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          python3 -m pip install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -e rustdesk.exe -t x86_64-pc-windows-msvc
          popd
          mkdir -p ./dist
          mv ./target/x86_64-pc-windows-msvc/release/rustdesk-portable-packer.exe "./dist/rustdesk-managed-${VERSION}-x86_64-install.exe"

      - name: Verify Windows x64 installation
        run: |
          $installer = (Resolve-Path "dist/rustdesk-managed-${env:VERSION}-x86_64-install.exe").Path
          $reader = [IO.BinaryReader]::new([IO.File]::OpenRead($installer))
          try {
            if ($reader.ReadUInt16() -ne 0x5a4d) { throw 'Installer is missing the DOS header' }
            $reader.BaseStream.Position = 0x3c
            $reader.BaseStream.Position = $reader.ReadInt32()
            if ($reader.ReadUInt32() -ne 0x4550 -or $reader.ReadUInt16() -ne 0x8664) {
              throw 'Installer is not a Windows x64 executable'
            }
          } finally {
            $reader.Dispose()
          }

          # Check startup without registering the disposable CI runner in the real API.
          $installedExe = Join-Path $env:ProgramFiles 'RustDesk\rustdesk.exe'
          New-NetFirewallRule -Name 'ManagedRustDeskCI' -DisplayName 'Isolate RustDesk CI' -Direction Outbound -Action Block -Program $installedExe | Out-Null
          $stateFile = Join-Path $env:ProgramFiles 'RustDesk-Managed-State\device.json'
          Start-Process -FilePath $installer -ArgumentList '--silent-install'
          $uninstallKey = 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\RustDesk'
          $deadline = [DateTime]::UtcNow.AddMinutes(3)
          do {
            $registered = Get-ItemProperty -LiteralPath $uninstallKey -ErrorAction SilentlyContinue
            $service = Get-Service -Name RustDesk -ErrorAction SilentlyContinue
            if ($registered.InstallLocation -and $service.Status -eq 'Running' -and (Test-Path -LiteralPath $stateFile)) { break }
            Start-Sleep -Seconds 2
          } while ([DateTime]::UtcNow -lt $deadline)
          if ($registered.DisplayVersion -ne $env:VERSION -or $service.Status -ne 'Running') {
            throw 'Pinned RustDesk version or running service was not found after installation'
          }
          $state = Get-Content -LiteralPath $stateFile -Raw | ConvertFrom-Json
          $deviceId = [Guid]::Empty
          if (![Guid]::TryParse($state.id, [ref]$deviceId) -or $state.bearer -cnotmatch '^[A-Za-z0-9_-]{43}$' -or $state.enrolled) {
            throw 'The isolated managed service did not initialize device identity automatically'
          }
          if (!(Get-Acl -LiteralPath (Split-Path -Parent $stateFile)).AreAccessRulesProtected) {
            throw 'Managed device state must not inherit Program Files permissions'
          }

      - name: Upload Windows x64 EXE installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustdesk-managed-${{ env.VERSION }}-windows-x64-exe
          path: dist/rustdesk-managed-${{ env.VERSION }}-x86_64-install.exe
          if-no-files-found: error
